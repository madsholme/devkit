services:
  web:
    image: ${DEVKIT_IMAGE:?Run devkit review}
    environment:
      DEVKIT_MODE: review
      DATA_DIR: /data
    volumes:
      - data:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 2s
      retries: 15
volumes:
  data:
