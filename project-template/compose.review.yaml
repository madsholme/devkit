services:
  web:
    # Copy this label to a separate API that needs the active share URL.
    labels:
      devkit.share.public-url: "true"
    image: ${DEVKIT_IMAGE:?Run devkit review}
    environment:
      DEVKIT_URL: ${DEVKIT_URL:?Run through devkit}
      DEVKIT_MODE: review
      DATA_DIR: /data
    volumes:
      - data:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 2s
      retries: 15
volumes:
  data:
