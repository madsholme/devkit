<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devbox</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
  --accent: #2f5bd3; --ok: #1f8a4c; --warn: #b7791f; --bad: #c0392b; --idle: #8a8a85;
  --code: #f0f0ec;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --panel: #1d1d1b; --text: #ecece8; --muted: #9a9a94; --line: #2e2e2b;
    --accent: #7ea2ff; --ok: #4cc27f; --warn: #e0a84a; --bad: #ef6b5b; --idle: #77776f;
    --code: #262624;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin-bottom: 20px; }
h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 10px; }
h1 img { width: 32px; height: 32px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
h3 { font-size: 14px; margin: 0 0 8px; }
details.section > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; margin: 28px 0 10px; }
details.section > summary::-webkit-details-marker { display: none; }
details.section > summary h2 { margin: 0; }
details.section > summary::before {
  content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
  transform: rotate(-45deg); transition: transform .15s; margin: 0 4px 0 2px;
}
details.section[open] > summary::before { transform: rotate(45deg); }
details.section > summary:hover h2, details.section > summary:hover .count { color: var(--text); }
.count { font-size: 12px; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 10px; }
.filters input[type=search], .filters select {
  font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 9px;
}
.filters input[type=search] { flex: 1; min-width: 200px; max-width: 420px; }
.filters input:focus, .filters select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.muted { color: var(--muted); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); }
.facts b { color: var(--text); font-weight: 500; }
.refresh { margin-left: auto; color: var(--muted); font-size: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; font-weight: 500; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
.group td { background: var(--code); font-weight: 600; padding: 6px 12px; }
.status { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
.s-healthy .dot, .s-running .dot { background: var(--ok); }
.s-starting .dot, .s-restarting .dot { background: var(--warn); }
.s-unhealthy .dot, .s-dead .dot, .s-missing .dot { background: var(--bad); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11.5px; border: 1px solid var(--line); color: var(--muted); }
.tag.live { color: var(--accent); border-color: var(--accent); }
.services { font-size: 12px; color: var(--muted); margin-top: 2px; }
button {
  font: inherit; font-size: 12.5px; color: var(--accent); background: none;
  border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
.actions { display: flex; gap: 6px; justify-content: flex-end; white-space: nowrap; }
.routed { color: var(--accent); }
.sysbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px; width: 100%; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px;
  color: var(--text); font-size: 13px; margin-bottom: 8px;
}
.sysbar:hover { border-color: var(--accent); }
.sys-item { display: inline-flex; align-items: center; gap: 8px; }
.sys-k { color: var(--muted); }
.sys-v { font-weight: 600; font-variant-numeric: tabular-nums; }
.mini { display: inline-block; width: 64px; }
.mini .meter { margin: 0; height: 5px; }
.sys-more { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-size: 12.5px; }
.sys-more svg { width: 14px; height: 14px; }
dialog.wide { width: min(1200px, calc(100vw - 32px)); }
#system-sub { flex: 1; font-size: 12.5px; }
.system-body { padding-top: 12px; }
.system-body .subhead:first-of-type { margin-top: 18px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tile { padding: 12px 14px; }
.tile .label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.tile .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0 6px; }
.tile .value small { font-size: 13px; font-weight: 400; color: var(--muted); }
.tile .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 3px; background: var(--code); overflow: hidden; margin: 4px 0 6px; }
.meter > span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.meter.warn > span { background: var(--warn); }
.meter.bad > span { background: var(--bad); }
.flag { font-size: 11px; font-weight: 600; }
.flag.warn { color: var(--warn); } .flag.bad { color: var(--bad); }
.spark { position: relative; height: 44px; margin-top: 4px; }
.spark svg { width: 100%; height: 100%; display: block; overflow: visible; }
.spark .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.spark .area { fill: var(--accent); opacity: .12; }
.spark .cursor { stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
.spark .tip {
  position: absolute; top: -26px; transform: translateX(-50%); pointer-events: none; white-space: nowrap;
  font-size: 11.5px; background: var(--text); color: var(--bg); padding: 2px 6px; border-radius: 4px;
}
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.subhead { font-size: 12.5px; font-weight: 600; margin: 16px 0 8px; }
.cmd { max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.details-body { overflow: auto; max-height: calc(100vh - 130px); padding: 4px 14px 16px; }
.details-body h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; display: flex; align-items: center; gap: 8px; }
.kv { width: 100%; border-collapse: collapse; }
.kv td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 12.5px; }
.kv td:first-child { width: 32%; color: var(--muted); word-break: break-all; }
.kv td:last-child { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
.kv tr:last-child td { border-bottom: 0; }
.kv tr.hidden { display: none; }
.details-body input[type=search] {
  font: inherit; font-size: 12px; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 2px 8px; text-transform: none; letter-spacing: 0; margin-left: auto; width: 180px;
}
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 26px; padding: 0;
  color: var(--accent); border: 1px solid var(--line); border-radius: 6px; background: none;
}
.icon-btn:hover { border-color: var(--accent); text-decoration: none; }
.icon-btn svg { width: 15px; height: 15px; }
.icon-btn .done { display: none; }
.icon-btn.copied { color: var(--ok); border-color: var(--ok); }
.icon-btn.copied .idle { display: none; }
.icon-btn.copied .done { display: block; }
.expand {
  display: inline-flex; align-items: center; justify-content: center; vertical-align: middle;
  width: 26px; height: 26px; padding: 0; margin-right: 8px; color: var(--muted);
}
.expand svg { width: 16px; height: 16px; transition: transform .15s; }
.expand[aria-expanded="true"] svg { transform: rotate(90deg); }
.expand:hover, .expand[aria-expanded="true"] { color: var(--accent); }
tr.preview { cursor: pointer; }
tr.preview:hover td { background: var(--code); }
.expand:hover { color: var(--accent); }
.containers td { background: var(--code); padding: 0 12px 10px 34px; }
.containers table { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.containers th, .containers td td { padding: 6px 10px; background: none; }
.repos { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.repo { padding: 14px 16px; }
.repo ul { list-style: none; margin: 0; padding: 0; }
.repo li { padding: 6px 0; border-top: 1px solid var(--line); }
.repo li:first-child { border-top: 0; }
.path { word-break: break-all; }
.empty { padding: 16px; color: var(--muted); }
.disk td:nth-child(n+2) { text-align: right; }
.disk th:nth-child(n+2) { text-align: right; }
dialog {
  width: min(1000px, calc(100vw - 32px)); max-height: calc(100vh - 64px); padding: 0;
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text);
}
dialog::backdrop { background: rgb(0 0 0 / .45); }
.dlg-head { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.dlg-head label { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.dlg-head .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); visibility: hidden; }
.dlg-head .live-dot.on { visibility: visible; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.dlg-head .mono { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
dialog pre { margin: 0; padding: 12px 14px; overflow: auto; max-height: calc(100vh - 130px); font-size: 12px; background: var(--code); white-space: pre-wrap; word-break: break-all; }
.error { color: var(--bad); padding: 12px 0; }
@media (max-width: 720px) {
  .hide-sm { display: none; }
  .containers td { padding-left: 12px; }
  .actions { flex-wrap: wrap; }
  .cmd { max-width: 44vw; }
  .sysbar { gap: 8px 18px; }
  .mini { width: 40px; }
  .sys-more { margin-left: 0; }
  .tile .spark { height: 36px; }
  .dlg-head { flex-wrap: wrap; }
  th, td { padding: 8px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1><img src="/logo.svg" alt="">devbox</h1>
    <div class="facts" id="facts"></div>
    <span class="refresh" id="refreshed">loading…</span>
  </header>
  <div id="error" class="error" hidden></div>

  <button class="sysbar" id="system-open" title="Show system details" aria-haspopup="dialog">
    <span class="sys-item"><span class="sys-k">CPU</span><span class="sys-v" id="sum-cpu">–</span><span class="mini" id="sum-cpu-m"></span></span>
    <span class="sys-item"><span class="sys-k">Memory</span><span class="sys-v" id="sum-mem">–</span><span class="mini" id="sum-mem-m"></span></span>
    <span class="sys-item"><span class="sys-k">Disk</span><span class="sys-v" id="sum-disk">–</span><span class="mini" id="sum-disk-m"></span></span>
    <span class="sys-more">Details<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg></span>
  </button>

  <h2>Previews <span class="count" id="preview-count"></span></h2>
  <div class="filters">
    <input type="search" id="filter-text" placeholder="Filter by name, project, branch, commit, worktree…" autocomplete="off">
    <select id="filter-mode" aria-label="Mode">
      <option value="">All modes</option><option value="live">Live</option><option value="review">Review</option>
    </select>
    <select id="filter-status" aria-label="Status">
      <option value="">Any status</option><option value="up">Running</option><option value="down">Not running</option>
    </select>
  </div>
  <div class="panel"><table>
    <thead><tr><th>Preview</th><th>Status</th><th class="hide-sm">Branch · commit</th><th class="hide-sm">Up</th><th></th></tr></thead>
    <tbody id="previews"></tbody>
  </table></div>

  <details class="section" id="sec-worktrees" open>
    <summary><h2>Worktrees</h2><span class="count" id="worktree-count"></span></summary>
    <div class="repos" id="repos"></div>
  </details>

  <details class="section" id="sec-orphans" open>
    <summary><h2>Clean-up candidates</h2><span class="count" id="orphan-count"></span></summary>
    <div class="panel" id="orphans"></div>
  </details>

  <details class="section" id="sec-disk" open>
    <summary><h2>Docker disk</h2><span class="count" id="disk-count"></span></summary>
    <div class="panel"><table class="disk">
      <thead><tr><th>Type</th><th>Size</th><th>Reclaimable</th></tr></thead>
      <tbody id="disk"></tbody>
    </table></div>
  </details>
</main>

<dialog id="system" class="wide">
  <div class="dlg-head"><span id="system-title"><b>System</b></span><span class="muted" id="system-sub"></span><button id="system-close">Close</button></div>
  <div class="details-body system-body">
    <div class="tiles" id="tiles"></div>
    <div class="subhead">Containers</div>
    <div class="panel"><table>
      <thead><tr><th>Container</th><th class="num">CPU</th><th class="num">Memory</th><th class="num hide-sm">Net in / out</th><th class="num hide-sm">Disk read / write</th><th class="num hide-sm">PIDs</th></tr></thead>
      <tbody id="ctr-stats"></tbody>
    </table></div>
    <div class="subhead">Top processes</div>
    <div class="panel"><table>
      <thead><tr><th class="num hide-sm">PID</th><th class="hide-sm">User</th><th>Process</th><th class="num">CPU</th><th class="num">Memory</th></tr></thead>
      <tbody id="procs"></tbody>
    </table></div>

  </div>
</dialog>

<dialog id="details">
  <div class="dlg-head"><span class="mono" id="details-title"></span><button id="details-close">Close</button></div>
  <div class="details-body" id="details-body"></div>
</dialog>

<dialog id="logs">
  <div class="dlg-head">
    <span class="live-dot" id="logs-live" title="following"></span>
    <span class="mono" id="logs-title"></span>
    <label><input type="checkbox" id="logs-follow"> Follow</label>
    <label><input type="checkbox" id="logs-hide-health" checked> Hide health checks</label>
    <button id="logs-reload">Reload</button><button id="logs-close">Close</button>
  </div>
  <pre id="logs-body"></pre>
</dialog>

<script>
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const short = c => (c || "").slice(0, 10);
const home = p => (p || "").replace(/^\/home\/[^/]+/, "~");

function ago(iso) {
  if (!iso) return "—";
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 90) return Math.round(s) + "s";
  if (s < 5400) return Math.round(s / 60) + "m";
  if (s < 172800) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
}

const status = s => `<span class="status s-${esc(s)}"><span class="dot"></span>${esc(s)}</span>`;

const expanded = new Set();

function containerRows(p) {
  return `<tr class="containers"><td colspan="5"><table>
    <thead><tr><th>Container</th><th>Status</th><th>Ports</th><th class="hide-sm">Image</th><th class="hide-sm">ID</th><th class="hide-sm">Up</th><th></th></tr></thead>
    <tbody>${p.services.map(c => `<tr>
      <td class="mono">${esc(c.name)}${c.web ? ' <span class="tag">web</span>' : ""}</td>
      <td>${status(c.status)}</td>
      <td class="mono">${c.ports.length ? c.ports.map(x => `<span${x.routed ? ' class="routed" title="Preview URL routes here through Traefik"' : ""}>${x.port}${x.protocol === "tcp" ? "" : "/" + esc(x.protocol)}${x.routed ? " ← URL" : ""}</span>`).join(", ") : '<span class="muted">—</span>'}</td>
      <td class="hide-sm mono path">${esc(c.image.startsWith("sha256:") ? c.image.slice(0, 19) : c.image)}</td>
      <td class="hide-sm mono">${esc(c.id)}</td>
      <td class="hide-sm">${ago(c.started)}</td>
      <td><div class="actions">
        <button data-details="${esc(p.name)}" data-service="${esc(c.name)}">Details</button>
        <button data-logs="${esc(p.name)}" data-service="${esc(c.name)}">Logs</button>
      </div></td>
    </tr>`).join("")}</tbody>
  </table></td></tr>`;
}

const store = {
  get(k) { try { return localStorage.getItem("devbox." + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("devbox." + k, v); } catch {} },
};
const UP = new Set(["healthy", "running", "starting"]);
const svg = (cls, d) => `<svg class="${cls}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  open: svg("", '<path d="M9 2.5h4.5V7"/><path d="M13.5 2.5 7 9"/><path d="M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3"/>'),
  copy: svg("idle", '<rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V3.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2"/>'),
  check: svg("done", '<path d="M3 8.5 6.5 12 13 4.5"/>'),
};

function matches(p) {
  const mode = $("filter-mode").value, state = $("filter-status").value;
  if (mode && p.mode !== mode) return false;
  if (state === "up" && !UP.has(p.status)) return false;
  if (state === "down" && UP.has(p.status)) return false;
  const words = $("filter-text").value.toLowerCase().split(/\s+/).filter(Boolean);
  const hay = [p.name, p.project, p.mode, p.status, p.branch, p.commit, p.worktree, p.url,
               ...p.services.map(c => c.name + " " + c.image)].join(" ").toLowerCase();
  return words.every(w => hay.includes(w));
}

function renderPreviews(all) {
  const previews = all.filter(matches);
  $("preview-count").textContent = previews.length === all.length ? `(${all.length})` : `(${previews.length} of ${all.length})`;
  if (!all.length) { $("previews").innerHTML = `<tr><td colspan="5" class="muted">No previews. Run <span class="mono">devbox live</span> in a worktree.</td></tr>`; return; }
  if (!previews.length) { $("previews").innerHTML = `<tr><td colspan="5" class="muted">No previews match the filter.</td></tr>`; return; }
  let html = "", project = null;
  for (const p of previews) {
    if (p.project !== project) { project = p.project; html += `<tr class="group"><td colspan="5">${esc(project)}</td></tr>`; }
    const open = expanded.has(p.name);
    const others = p.services.filter(s => !s.web).map(s => `${esc(s.name)} ${esc(s.status)}`).join(" · ");
    html += `<tr class="preview" data-row="${esc(p.name)}">
      <td><button class="expand" data-expand="${esc(p.name)}" aria-expanded="${open}" title="Show containers"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button><span class="tag ${p.mode === "live" ? "live" : ""}">${esc(p.mode)}</span>
        ${p.status === "healthy" || p.status === "running" ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name)}
        ${p.worktree ? `<div class="services mono path">${esc(home(p.worktree))}</div>` : ""}</td>
      <td>${status(p.status)}${others && !open ? `<div class="services">${others}</div>` : ""}</td>
      <td class="hide-sm mono">${esc(p.branch || "detached")} · ${esc(short(p.commit))}</td>
      <td class="hide-sm">${ago(p.started)}</td>
      <td><div class="actions">
        ${UP.has(p.status) ? `<a class="icon-btn" href="${esc(p.url)}" target="_blank" rel="noopener" title="Open ${esc(p.url)} in a new tab" aria-label="Open in a new tab">${ICON.open}</a>
        <button class="icon-btn" data-copy="${esc(p.url)}" title="Copy ${esc(p.url)}" aria-label="Copy URL">${ICON.copy}${ICON.check}</button>` : ""}
        <button data-logs="${esc(p.name)}">Logs</button>
      </div></td>
    </tr>`;
    if (open) html += containerRows(p);
  }
  $("previews").innerHTML = html;
}

function renderRepos(repos) {
  const trees = repos.reduce((n, r) => n + r.worktrees.length, 0);
  $("worktree-count").textContent = `${trees} in ${repos.length} ${repos.length === 1 ? "repository" : "repositories"}`;
  $("repos").innerHTML = repos.map(r => `<div class="panel repo">
    <h3 class="mono path">${esc(home(r.path.replace(/\/\.git$/, "")))}</h3>
    <ul>${r.worktrees.map(w => `<li>
      <div class="mono">${esc(w.branch || "detached")}</div>
      <div class="muted mono path">${esc(home(w.path))}</div>
      <div class="services">${w.previews.length ? "preview: " + w.previews.map(esc).join(", ") : "no preview"}</div>
    </li>`).join("")}</ul>
  </div>`).join("") || `<div class="panel empty">No repositories with previews yet.</div>`;
}

function renderOrphans(repos) {
  const rows = repos.flatMap(r => r.orphans.map(o => ({...o, repo: r.path.replace(/\/\.git$/, "")})));
  $("orphan-count").textContent = rows.length ? `${rows.length} to remove` : "none";
  $("orphans").innerHTML = rows.length
    ? `<table><thead><tr><th>Preview</th><th>Mode</th><th class="hide-sm">Removed worktree</th></tr></thead><tbody>${rows.map(o =>
        `<tr><td class="mono">${esc(o.name)}</td><td>${esc(o.mode)}</td><td class="hide-sm mono path">${esc(home(o.worktree))}</td></tr>`).join("")}</tbody></table>
       <div class="empty">Remove them with <span class="mono">devbox gc --yes</span> in the repository.</div>`
    : `<div class="empty">None. Every preview's worktree still exists.</div>`;
}

function renderHost(h) {
  $("facts").innerHTML = `
    <span><a href="${esc(h.t3)}" target="_blank" rel="noopener">T3 Code</a></span>
    <span>${esc(h.domain)}</span>
    <span>cert expires <b>${esc(h.certificate_expires)}</b></span>
    <span><b>${h.running_containers}</b> containers running</span>`;
  const images = h.disk.find(d => d.type === "Images");
  $("disk-count").textContent = images ? `images ${images.size}, ${images.reclaimable} reclaimable` : "";
  $("disk").innerHTML = h.disk.map(d => `<tr><td>${esc(d.type)}</td><td>${esc(d.size)}</td><td>${esc(d.reclaimable)}</td></tr>`).join("");
}

async function load() {
  try {
    const res = await fetch("api/overview");
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    lastData = data;
    renderPreviews(data.previews);
    renderRepos(data.repositories);
    renderOrphans(data.repositories);
    renderHost(data.host);
    $("error").hidden = true;
    $("refreshed").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) {
    $("error").hidden = false;
    $("error").textContent = "Could not load overview: " + e.message;
  }
}

async function copyText(text, button) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // Fallback for browsers without the async clipboard API.
    const area = Object.assign(document.createElement("textarea"), {value: text});
    document.body.append(area); area.select(); document.execCommand("copy"); area.remove();
  }
  button.classList.add("copied");
  setTimeout(() => button.classList.remove("copied"), 1200);
}

const kv = rows => `<table class="kv">${rows.map(([k, v]) =>
  `<tr data-k="${esc(String(k).toLowerCase() + " " + String(v).toLowerCase())}"><td>${esc(k)}</td><td>${esc(v === "" || v == null ? "—" : v)}</td></tr>`).join("")}</table>`;
const cmd = a => (a || []).map(x => /\s/.test(x) ? JSON.stringify(x) : x).join(" ");

async function showDetails(preview, service) {
  $("details-title").textContent = preview + " · " + service;
  $("details-body").innerHTML = '<p class="muted">loading…</p>';
  if (!$("details").open) $("details").showModal();
  const res = await fetch(`api/container?preview=${encodeURIComponent(preview)}&service=${encodeURIComponent(service)}`);
  if (!res.ok) { $("details-body").innerHTML = `<p class="error">${esc(await res.text())}</p>`; return; }
  const d = await res.json(), h = d.health;
  const section = (title, body, filter) => `<h4>${esc(title)}${filter ? `<input type="search" data-filter placeholder="Filter…">` : ""}</h4>${body}`;
  $("details-body").innerHTML = [
    section("Container", kv([
      ["Name", d.name], ["ID", d.id.slice(0, 12)], ["Status", d.status + (d.status === "exited" ? ` (exit ${d.exit_code})` : "")],
      ["Image", d.image], ["Image ID", d.image_id.slice(0, 19)], ["Created", d.created], ["Started", d.started],
      ["Restart policy", d.restart_policy], ["Restarts", d.restart_count], ["User", d.user], ["Working dir", d.working_dir],
      ["Entrypoint", cmd(d.entrypoint)], ["Command", cmd(d.command)],
    ])),
    h.status ? section("Health", kv([
      ["Status", h.status], ["Check", cmd(h.test.filter((x, i) => i || !x.startsWith("CMD")))], ["Failing streak", h.failing_streak],
      ["Last exit", h.last_exit], ["Last output", h.last_output],
    ])) : "",
    section("Ports", d.ports.length ? kv(d.ports.map(x => [x.port + "/" + x.protocol, x.routed ? "preview URL (Traefik)" : "internal"])) : '<p class="muted">None</p>'),
    section("Networks", kv(d.networks.map(n => [n.name, n.ip + (n.aliases.length ? "  (" + n.aliases.join(", ") + ")" : "")]))),
    section("Mounts", d.mounts.length ? kv(d.mounts.map(m => [m.destination, `${m.type} ${m.source}${m.rw ? "" : " (read-only)"}`])) : '<p class="muted">None</p>'),
    section(`Environment (${d.env.length})`, kv(d.env.map(e => [e.name, e.value])), true),
    section(`Labels (${Object.keys(d.labels).length})`, kv(Object.entries(d.labels)), true),
  ].join("");
}
$("details-close").onclick = () => $("details").close();
$("details-body").addEventListener("input", e => {
  if (!e.target.matches("[data-filter]")) return;
  const q = e.target.value.toLowerCase(), table = e.target.closest("h4").nextElementSibling;
  for (const tr of table.querySelectorAll("tr")) tr.classList.toggle("hidden", !!q && !tr.dataset.k.includes(q));
});

const GB = 2 ** 30;
const bytes = b => b >= GB ? (b / GB).toFixed(1) + " GB" : Math.round(b / 2 ** 20) + " MB";
const level = pct => pct >= 90 ? "bad" : pct >= 75 ? "warn" : "";
const flag = pct => level(pct) ? `<span class="flag ${level(pct)}">${level(pct) === "bad" ? "critical" : "high"}</span>` : "";
const meter = pct => `<div class="meter ${level(pct)}" role="meter" aria-valuenow="${pct.toFixed(0)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${Math.min(100, pct).toFixed(1)}%"></span></div>`;
const clock = t => new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});

// A single-series sparkline on a fixed 0-100% scale, with a hover readout.
function spark(id, history, value, fmt) {
  const pts = history.map(h => [h.t, value(h)]).filter(([, v]) => v != null);
  if (pts.length < 2) return `<div class="spark muted sub">collecting…</div>`;
  const t0 = pts[0][0], span = pts[pts.length - 1][0] - t0 || 1;
  const xy = pts.map(([t, v]) => [((t - t0) / span) * 100, 40 - Math.min(100, v) * 0.4]);
  const line = xy.map(([x, y]) => `${x.toFixed(2)},${y.toFixed(2)}`).join(" ");
  return `<div class="spark" data-spark="${id}">
    <svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-label="last ${Math.round(span / 60)} minutes">
      <polygon class="area" points="0,40 ${line} 100,40"/><polyline class="line" points="${line}"/>
      <line class="cursor" x1="0" x2="0" y1="0" y2="40" visibility="hidden"/>
    </svg><span class="tip" hidden></span></div>`;
}
const sparkData = {};
document.addEventListener("pointermove", e => {
  for (const el of document.querySelectorAll("[data-spark]")) {
    const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), cur = el.querySelector(".cursor");
    const r = svg.getBoundingClientRect(), inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top - 8 && e.clientY <= r.bottom + 8;
    const series = sparkData[el.dataset.spark];
    if (!inside || !series) { tip.hidden = true; cur.setAttribute("visibility", "hidden"); continue; }
    const t0 = series[0][0], span = series[series.length - 1][0] - t0 || 1;
    const t = t0 + ((e.clientX - r.left) / r.width) * span;
    const [pt, pv] = series.reduce((a, b) => Math.abs(b[0] - t) < Math.abs(a[0] - t) ? b : a);
    const x = ((pt - t0) / span) * 100;
    cur.setAttribute("x1", x); cur.setAttribute("x2", x); cur.setAttribute("visibility", "visible");
    tip.hidden = false; tip.style.left = x + "%"; tip.textContent = `${series.fmt(pv)} · ${clock(pt)}`;
  }
});

function renderResources(r) {
  const h = r.history, last = h[h.length - 1];
  if (!last) { $("tiles").innerHTML = '<div class="panel tile muted">collecting…</div>'; return; }
  const memPct = 100 * last.mem_used / last.mem_total, diskPct = 100 * last.disk_used / last.disk_total;
  const swapPct = last.swap_total ? 100 * last.swap_used / last.swap_total : 0;
  const days = Math.floor(r.uptime / 86400), hours = Math.floor(r.uptime % 86400 / 3600);
  $("sum-cpu").innerHTML = `${last.cpu.toFixed(0)}% ${flag(last.cpu)}`;
  $("sum-mem").innerHTML = `${(last.mem_used / GB).toFixed(1)} / ${(last.mem_total / GB).toFixed(0)} GB ${flag(memPct)}`;
  $("sum-disk").innerHTML = `${diskPct.toFixed(0)}% ${flag(diskPct)}`;
  $("sum-cpu-m").innerHTML = meter(last.cpu);
  $("sum-mem-m").innerHTML = meter(memPct);
  $("sum-disk-m").innerHTML = meter(diskPct);
  if (!$("system").open) return;
  $("system-sub").textContent = `${r.cores} cores · up ${days}d ${hours}h · every ${r.interval}s`;
  const series = (key, fn, fmt) => { const s = h.map(x => [x.t, fn(x)]); s.fmt = fmt; sparkData[key] = s; };
  series("cpu", x => x.cpu, v => v.toFixed(1) + "%");
  series("mem", x => 100 * x.mem_used / x.mem_total, v => v.toFixed(1) + "%");
  $("tiles").innerHTML = `
    <div class="panel tile"><div class="label"><span>CPU · ${r.cores} cores</span>${flag(last.cpu)}</div>
      <div class="value">${last.cpu.toFixed(0)}<small>%</small></div>${meter(last.cpu)}
      <div class="sub">load ${last.load.map(l => l.toFixed(2)).join(" · ")}</div>
      ${spark("cpu", h, x => x.cpu)}</div>
    <div class="panel tile"><div class="label"><span>Memory</span>${flag(memPct)}</div>
      <div class="value">${bytes(last.mem_used)} <small>of ${bytes(last.mem_total)}</small></div>${meter(memPct)}
      <div class="sub">${memPct.toFixed(0)}% used</div>
      ${spark("mem", h, x => 100 * x.mem_used / x.mem_total)}</div>
    <div class="panel tile"><div class="label"><span>Disk /</span>${flag(diskPct)}</div>
      <div class="value">${bytes(last.disk_used)} <small>of ${bytes(last.disk_total)}</small></div>${meter(diskPct)}
      <div class="sub">${bytes(last.disk_total - last.disk_used)} free</div></div>
    <div class="panel tile"><div class="label"><span>Swap</span>${flag(swapPct)}</div>
      <div class="value">${bytes(last.swap_used)} <small>of ${bytes(last.swap_total)}</small></div>${meter(swapPct)}
      <div class="sub">${swapPct.toFixed(0)}% used</div></div>`;
  $("ctr-stats").innerHTML = (r.containers || []).map(c => `<tr>
      <td class="mono">${c.preview ? `${esc(c.preview)} · <b>${esc(c.service)}</b>` : esc(c.name)}</td>
      <td class="num">${c.cpu.toFixed(1)}%</td><td class="num">${esc(c.mem)}</td>
      <td class="num hide-sm">${esc(c.net)}</td><td class="num hide-sm">${esc(c.block)}</td><td class="num hide-sm">${esc(c.pids)}</td>
    </tr>`).join("") || '<tr><td colspan="6" class="muted">collecting…</td></tr>';
  $("procs").innerHTML = (r.processes || []).map(p => `<tr>
      <td class="num mono hide-sm">${p.pid}</td><td class="hide-sm">${esc(p.user)}</td>
      <td><div class="mono cmd" title="${esc(p.command)}"><b>${esc(p.name)}</b> <span class="muted">${esc(p.command)}</span></div></td>
      <td class="num">${p.cpu.toFixed(1)}%</td><td class="num">${bytes(p.rss)}</td>
    </tr>`).join("") || '<tr><td colspan="5" class="muted">collecting…</td></tr>';
}

async function loadResources() {
  if (document.hidden) return;
  try {
    // Container and process sampling only runs while the details are open.
    const res = await fetch("api/resources" + ($("system").open ? "?full=1" : ""));
    if (res.ok) renderResources(await res.json());
  } catch {}
}

let lastData = null;
let logsFor = null, logLines = [], stream = null, paintQueued = false;
const MAX_LINES = 5000;
const HEALTH = /"(GET|HEAD) \/health\/?\S* HTTP|healthcheck/i;

function paintLogs() {
  paintQueued = false;
  const pre = $("logs-body");
  const atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
  const lines = $("logs-hide-health").checked ? logLines.filter(l => !HEALTH.test(l)) : logLines;
  pre.textContent = lines.join("\n") || (stream ? "(waiting for output…)" : "(no output)");
  if (atBottom) pre.scrollTop = pre.scrollHeight;
}
function queuePaint() { if (!paintQueued) { paintQueued = true; requestAnimationFrame(paintLogs); } }

function addText(text, carry) {
  const parts = (carry + text).split("\n");
  const rest = parts.pop();
  logLines.push(...parts);
  if (logLines.length > MAX_LINES) logLines.splice(0, logLines.length - MAX_LINES);
  queuePaint();
  return rest;
}

function stopFollow() {
  if (stream) stream.abort();
  stream = null;
  $("logs-live").classList.remove("on");
}

function logsUrl(extra = "") {
  return `api/logs?preview=${encodeURIComponent(logsFor.preview)}` +
    (logsFor.service ? `&service=${encodeURIComponent(logsFor.service)}` : "") + extra;
}

async function loadLogs() {
  stopFollow();
  logLines = [];
  $("logs-body").textContent = "loading…";
  if ($("logs-follow").checked) return follow();
  const res = await fetch(logsUrl());
  const text = await res.text();
  logLines = text.replace(/\n$/, "").split("\n").filter(Boolean);
  paintLogs();
  $("logs-body").scrollTop = $("logs-body").scrollHeight;
}

async function follow() {
  const ctrl = new AbortController();
  stream = ctrl;
  $("logs-live").classList.add("on");
  try {
    const res = await fetch(logsUrl("&follow=1"), {signal: ctrl.signal});
    if (!res.ok) { logLines = [await res.text()]; paintLogs(); return; }
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let carry = "";
    paintLogs();
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      carry = addText(decoder.decode(value, {stream: true}), carry);
    }
    if (carry) addText("\n", carry);
  } catch (e) {
    if (e.name !== "AbortError") { logLines.push("[stream error: " + e.message + "]"); queuePaint(); }
  } finally {
    if (stream === ctrl) { stream = null; $("logs-live").classList.remove("on"); }
  }
}

function showLogs(preview, service) {
  logsFor = {preview, service};
  $("logs-title").textContent = preview + " · " + (service || "web");
  if (!$("logs").open) $("logs").showModal();
  $("logs-body").scrollTop = 0;
  loadLogs();
}

document.addEventListener("click", e => {
  const det = e.target.closest("[data-details]");
  if (det) return showDetails(det.dataset.details, det.dataset.service);
  const c = e.target.closest("[data-copy]");
  if (c) return copyText(c.dataset.copy, c);
  const b = e.target.closest("[data-logs]");
  if (b) return showLogs(b.dataset.logs, b.dataset.service);
  // Clicking anywhere on a preview row toggles it, except its link.
  const x = e.target.closest("[data-expand]") || (!e.target.closest("a") && e.target.closest("[data-row]"));
  if (x) {
    const name = x.dataset.expand || x.dataset.row;
    expanded.has(name) ? expanded.delete(name) : expanded.add(name);
    if (lastData) renderPreviews(lastData.previews);
  }
});
$("logs-close").onclick = () => $("logs").close();
$("logs").addEventListener("close", stopFollow);
$("logs-reload").onclick = () => logsFor && loadLogs();
$("logs-follow").onchange = () => logsFor && loadLogs();
$("logs-hide-health").onchange = paintLogs;

for (const id of ["filter-text", "filter-mode", "filter-status"]) {
  const el = $(id), saved = store.get(id);
  if (saved !== null) el.value = saved;
  el.addEventListener("input", () => { store.set(id, el.value); if (lastData) renderPreviews(lastData.previews); });
}
$("filter-text").addEventListener("keydown", e => { if (e.key === "Escape") { e.target.value = ""; e.target.dispatchEvent(new Event("input")); } });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !e.target.closest("input, select, textarea") && !$("logs").open) { e.preventDefault(); $("filter-text").focus(); }
});
for (const d of document.querySelectorAll("details.section")) {
  if (store.get(d.id) === "closed") d.open = false;
  d.addEventListener("toggle", () => store.set(d.id, d.open ? "open" : "closed"));
}

loadResources();
setInterval(loadResources, 5000);
$("system-open").onclick = () => { $("system").showModal(); loadResources(); };
$("system-close").onclick = () => $("system").close();
load();
setInterval(() => { if (!document.hidden && !document.querySelector("dialog[open]")) load(); }, 10000);
</script>
</body>
</html>
